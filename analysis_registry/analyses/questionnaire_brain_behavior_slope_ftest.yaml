id: "questionnaire_brain_behavior_slope_ftest"
name: "Assess how within-subject brain-behavior slopes differ between questionnaires"
stage: "group"
description: >
    Using randomise, run an F-test on the within-subject slopes between brain activation and behavioral response for each questionnaire 
    to see whether any within-questionnaire slopes are statistically different from each other. 
code_dir: "analyses/questionnaire_brain_behavior_slope_ftest"
dependencies: 
    - "Output files from within_subject_brain_behavior_by_questionnaire analysis"
script_entry: 
    - "randomise scripts are created in each output_glm_ftest subdirectory in 
      survey_medley_results/within_subject_brain_behavior_by_questionnaire/"
notebook_entry:
    - "run_ftest.ipynb"
other_files: 
    - "submit_randomise_min_obs_5_min_unique_2_min_obs_binary_2.sh"
    - "submit_randomise_min_obs_5_min_unique_3_min_obs_binary_None.sh"
    - "submit_randomise_min_obs_6_min_unique_3_min_obs_binary_None.sh"
results_files: 
    - "run_ftest.ipynb"
output_dir: "oak/stanford/groups/russpold/data/uh2/aim1/derivatives/survey_medley_results/questionnaire_brain_behavior_slope_ftest"
hypothesis: "Some within-questionnaire slopes statistically differ from each other in some parts of the brain."
conclusion: "Within-questionnaire slopes do not statistically differ."
notes: null
status: "needs review"
last_updated: 2025-03-02
authors: ["Jaemon Jumpawong", "Jeanette Mumford"]
