id: within_subject_brain_behavior_by_questionnaire
name: Assess within-subject brain-behavior slopes in each questionnaire
stage: "time series and group"
description: >
    Estimate the within-subject slope between brain activation and behavioral response
    separately for each questionnaire.
code_dir: "analyses/within_subject_brain_behavior_by_questionnaire"
dependencies:
    - "Output files from within_subject_question_estimates analysis"
script_entry:
    - "submit_slope_model.batch"
    - "subject_slope_contrasts.py"
notebook_entry:
    - "glm_setup.ipynb"
    - "brain_behavior_within_subject_by_questionnaire.ipynb"
    - "inclusion_settings_model_overview.ipynb"
other_files: []
results_files:
    - "brain_behavior_within_subject_by_questionnaire.ipynb"
    - "inclusion_settings_model_overview.ipynb"
output_dir: "oak/stanford/groups/russpold/data/uh2/aim1/derivatives/survey_medley_results/within_subject_brain_behavior_by_questionnaire"
hypothesis: "Some brain/behavior slopes are statistically different between questionnaires."
conclusion: >
    It would be worth running an F-test to determine whether there are in fact brain/behavior slopes that are statistically different between questionnaires.
notes: >
    Slope estimates are adjusted for the character counts of each survey question.
status: "needs review"
last_updated: 2026-03-02
authors: ["Jaemon Jumpawong", "Jeanette Mumford"]
